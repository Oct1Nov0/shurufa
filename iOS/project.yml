name: ZhJaKeyboard
options:
  bundleIdPrefix: app.selfuse.zhjakeyboard
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    # Built unsigned in CI; Sideloadly signs the app and the keyboard on install.
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  ZhJaKeyboard:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.selfuse.zhjakeyboard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 中日键盘
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    dependencies:
      - target: ZhJaKeyboardExtension
        embed: true
  ZhJaKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        excludes:
          - Info.plist
      - InterfaceText.swift
      - ../Sources/Engine.swift
      - ../Sources/EngineKeyHandler.swift
      - ../Sources/InputBackend.swift
      - ../Sources/ChineseWithJapaneseBackend.swift
      - ../Sources/JapaneseBackend.swift
      - ../crates/meowpuut-ffi/include/meowpuut.h
      - ../Sources/ChoiceMemory.swift
      - ../Sources/Symbols.swift
      - ../Sources/Appearance.swift
      - ../Sources/CandidatePalette.swift
      - ../Sources/GlassShapes.swift
      - ../Sources/Bridge.h
      - path: Generated/Licenses
        type: folder
        buildPhase: resources
      - path: Generated/mimo_base.bin
        buildPhase: resources
      - path: Generated/mimo_jp.bin
        buildPhase: resources
      - path: Generated/mimo_pairs.bin
        buildPhase: resources
      - path: Generated/associations.json
        buildPhase: resources
      - path: ../Resources/Lexicon/kaomoji.tsv
        buildPhase: resources
      - path: Generated/language-evidence.sqlite
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Keyboard/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: app.selfuse.zhjakeyboard.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_OBJC_BRIDGING_HEADER: Keyboard/Bridge.h
        # Rust engine (crates/meowpuut-ffi), built by the pre-build script below.
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(PROJECT_DIR)/../.build/rust/$(PLATFORM_NAME)"]
        OTHER_LDFLAGS: ["$(inherited)", "-lmeowpuut_ffi", "-lsqlite3"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build Rust engine
        script: bash "$PROJECT_DIR/../scripts/build-rust.sh" xcode
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(PROJECT_DIR)/../.build/rust/$(PLATFORM_NAME)/libmeowpuut_ffi.a

schemes:
  ZhJaKeyboard:
    build:
      targets:
        ZhJaKeyboard: all
